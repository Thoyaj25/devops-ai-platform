services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.app

    image: marketsphere-app:latest
    container_name: marketsphere-app

    restart: unless-stopped
    init: true

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://marketsphere:marketsphere@postgres:5432/marketsphere?schema=public}

      REDIS_URL: redis://redis:6379

      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}

      DOCKER_NETWORK: marketsphere


    ports:
      - "3000:3000"


    volumes:
      # Required for rollback/deployment operations
      - /var/run/docker.sock:/var/run/docker.sock

      # Nginx deployment configs
      - ./nginx/conf.d:/app/nginx/conf.d


    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


    networks:
      - marketsphere





  worker:

    build:
      context: .
      dockerfile: Dockerfile.worker


    image: marketsphere-worker:latest
    container_name: marketsphere-worker


    restart: unless-stopped
    init: true


    command:
      [
        "npm",
        "run",
        "worker"
      ]


    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy



    environment:

      NODE_ENV: production


      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://marketsphere:marketsphere@postgres:5432/marketsphere?schema=public}

      REDIS_URL: redis://redis:6379


      DOCKER_IMAGE: ${DOCKER_IMAGE}
      DOCKER_REGISTRY: ${DOCKER_REGISTRY}

      DOCKER_USER: ${DOCKER_USER}
      DOCKER_PASSWORD: ${DOCKER_PASSWORD}


      DOCKER_NETWORK: marketsphere



    volumes:

      - /var/run/docker.sock:/var/run/docker.sock

      - ./nginx/conf.d:/app/nginx/conf.d



    networks:

      - marketsphere







  nginx:

    image: nginx:1.29-alpine

    container_name: marketsphere-nginx


    restart: unless-stopped



    depends_on:

      app:
        condition: service_healthy



    ports:

      - "80:80"



    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      - ./nginx/conf.d:/etc/nginx/conf.d



    healthcheck:

      test:

        [
          "CMD",
          "nginx",
          "-t"
        ]

      interval: 30s
      timeout: 10s
      retries: 3



    networks:

      - marketsphere







  postgres:

    image: postgres:16-alpine

    container_name: marketsphere-postgres


    restart: unless-stopped



    environment:

      POSTGRES_USER: marketsphere

      POSTGRES_PASSWORD: marketsphere

      POSTGRES_DB: marketsphere



    ports:

      - "5432:5432"



    volumes:

      - postgres_data:/var/lib/postgresql/data



    healthcheck:

      test:

        [
          "CMD-SHELL",
          "pg_isready -U marketsphere -d marketsphere"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



    networks:

      - marketsphere







  redis:

    image: redis:8-alpine

    container_name: marketsphere-redis


    restart: unless-stopped



    command:

      [
        "redis-server",
        "--appendonly",
        "yes"
      ]



    ports:

      - "6379:6379"



    volumes:

      - redis_data:/data



    healthcheck:

      test:

        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



    networks:

      - marketsphere







volumes:

  postgres_data:

  redis_data:




networks:

  marketsphere:

    name: marketsphere

    driver: bridge